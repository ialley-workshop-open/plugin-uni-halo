apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-uni-halo-settings
spec:
  forms:
    - group: featureConfig
      label: 基本设置
      formSchema:
        - $formkit: group
          name: linkConfig
          label: 友情链接
          children:
            - $formkit: radio
              name: sendEmail
              id: sendEmail
              label: 审核结果邮件通知
              value: false
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
              help: 开启后，审核通过/拒绝时向申请人邮箱发送通知（复用 Halo 系统设置的邮件通知器 SMTP 配置，无需重复填写；申请未填邮箱则不发送）。
            - $formkit: text
              if: "$get(sendEmail).value === true"
              name: siteName
              label: 邮件署名
              value: "uni-halo"
              help: 审核邮件标题与正文中的站点名称。
    - group: safetyConfig
      label: 安全控制
      formSchema:
        - $formkit: group
          name: auditConfig
          label: 审核模式
          children:
            - $formkit: radio
              name: auditModeEnabled
              id: auditModeEnabled
              label: 审核模式
              help: 开启审核模式，关闭小程序部分数据展示，小程序提交审核使建议开启，审核后关闭。
              value: false
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
        - $formkit: group
          name: captchaConfig
          label: 防刷验证码
          children:
            - $formkit: radio
              name: enabled
              id: captchaEnabled
              label: 开启验证码
              help: 总开关。关闭后所有功能都不要求验证码；开启后仅对下方「生效范围」勾选的功能要求输入验证码，防止暴力/垃圾提交。
              value: true
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
            - $formkit: group
              if: "$get(captchaEnabled).value === true"
              name: scope
              label: 生效范围
              help: 选择需要输入验证码的功能；未勾选的功能即使总开关开启也无需验证码。
              value:
                linkSubmission: true
                loveAlbumUnlock: true
              children:
                - $formkit: select
                  name: linkSubmission
                  label: 链接申请提交
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，小程序端提交链接申请时需要输入验证码，防止垃圾申请堆积。
                  validation: required
                - $formkit: select
                  name: loveAlbumUnlock
                  label: 恋爱相册解锁
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，加密恋爱相册解锁时需要输入验证码，防止暴力试密码。
                  validation: required
            - $formkit: select
              if: "$get(captchaEnabled).value === true"
              name: type
              id: captchaType
              label: 验证码类型
              value: "ALPHANUMERIC"
              options:
                - label: 图形字符
                  value: "ALPHANUMERIC"
                - label: 算术题
                  value: "ARITHMETIC"
              validation: required
            - $formkit: number
              if: "$get(captchaEnabled).value === true && $get(captchaType).value === 'ALPHANUMERIC'"
              name: captchaLength
              label: 字符长度
              value: 4
              help: 图形字符验证码的字符个数
              validation: required
            - $formkit: number
              if: "$get(captchaEnabled).value === true && $get(captchaType).value === 'ARITHMETIC'"
              name: arithmeticRange
              label: 算术范围
              value: 10
              help: 算术题运算数的取值范围（1~N）
              validation: required
    - group: integrationConfig
      label: 平台接入
      formSchema:
        - $formkit: group
          name: pluginConfig
          label: 第三方插件
          children:
            - $formkit: group
              name: toolsPlugin
              label: 工具箱插件
              value:
                enabled: false
                pluginId: "PluginTools"
                Authorization: ""
                verifyCodeType: "scan"
                scanCodeUrl: ""
                rewardedVideoAdId: ""
              children:
                - $el: div
                  attrs:
                    class: "formkit-help text-xs mt-2 text-gray-500 flex items-center mb-1 cursor-pointer"
                    innerHTML: "说明：来自【作者：<a href='https://blog.muyin.site' title='前往作者博客' target='_blank' class='text-blue-500 hover:text-blue-700'>柳意梧情</a>】的<a href='https://auth.muyin.site/docs/PluginTools' title='前往获取Tools工具箱插件' target='_blank' class='text-blue-500 hover:text-blue-700'>Tools工具箱插件</a>，用于开启支持文章加密访问。"
                - $formkit: select
                  name: enabled
                  id: toolsPluginEnabled
                  label: 是否启用
                  value: false
                  options:
                    - label: 启用
                      value: true
                    - label: 关闭
                      value: false
                  validation: required
                - $formkit: text
                  if: "$get(toolsPluginEnabled).value === true"
                  name: pluginId
                  label: 插件ID
                  value: "PluginTools"
                  validation: required
                - $el: div
                  if: "$get(toolsPluginEnabled).value === true"
                  attrs:
                    class: "formkit-help text-xs text-gray-500"
                    innerHTML: "插件信息的ID，<a href='/console/plugins/PluginTools#:~:text=ID-,PluginTools' title='前往获取插件ID' target='_blank' class='text-blue-500 hover:text-blue-700'>获取插件ID</a>。"
                - $formkit: text
                  if: "$get(toolsPluginEnabled).value === true"
                  name: Authorization
                  label: 授权Token
                  value: ""
                  validation: required
                - $el: div
                  if: "$get(toolsPluginEnabled).value === true"
                  attrs:
                    class: "formkit-help text-xs text-gray-500"
                    innerHTML: "Tools工具箱插件设置的认证token，<a href='/console/plugins/PluginTools?tab=basic#:~:text=模板设置-,认证token' title='前往获取认证token' target='_blank' class='text-blue-500 hover:text-blue-700'>获取认证token</a>。"
                - $formkit: radio
                  if: "$get(toolsPluginEnabled).value === true"
                  id: verifyCodeType
                  name: verifyCodeType
                  key: verifyCodeType
                  label: 验证码获取方式
                  value: "scan"
                  options:
                    - label: 微信公众号获取
                      value: scan
                    - label: 小程序广告获取
                      value: advert
                  help: 验证码获取方式，可以前往文章单独设置验证码获取方式。
                  validation: required
                - $formkit: attachment
                  if: "$get(verifyCodeType).value === 'scan'"
                  name: scanCodeUrl
                  key: scanCodeUrl
                  label: 扫码链接
                  value: ""
                  help: 扫码链接，请填写二维码图片的链接。
                  validation: required
                - $formkit: text
                  if: "$get(verifyCodeType).value === 'advert'"
                  name: rewardedVideoAdId
                  key: rewardedVideoAdId
                  label: 视频广告ID
                  value: ""
                  help: 广告ID，请在 微信小程序广告管理中获取。
                  validation: required
    - group: themeConfig
      label: 主题展示
      formSchema:
        - $formkit: group
          name: floatingWindow
          label: 主题悬浮窗
          children:
            - $formkit: switch
              name: enabled
              id: floatingWindowEnabled
              label: 在主题显示悬浮窗
              value: false
              help: 开启后向主题页面注入悬浮球；关闭后页面零残留。
            - $formkit: select
              name: pageScope
              id: floatingWindowPageScope
              label: 显示范围
              value: "all"
              options:
                - label: 全部页面
                  value: "all"
                - label: 仅以下路径显示
                  value: "only"
                - label: 以下路径不显示
                  value: "except"
              validation: required
              help: 控制悬浮球在哪些主题页面出现。「仅/排除」模式配合下方「路径模式」使用。
            - $formkit: textarea
              name: pagePatterns
              id: floatingWindowPagePatterns
              label: 路径模式
              value: ""
              help: 每行一个路径模式，匹配当前页面 pathname。* 匹配任意非 / 字符，** 匹配任意字符（含 /）；留空或只写 / 表示仅首页。例如 /archives/** 匹配文章详情页。
            - $formkit: select
              name: position
              id: floatingWindowPosition
              label: 显示位置
              value: "bottom-right"
              options:
                - label: 左上角
                  value: "top-left"
                - label: 顶部居中
                  value: "top-center"
                - label: 右上角
                  value: "top-right"
                - label: 右侧居中
                  value: "right-center"
                - label: 右下角
                  value: "bottom-right"
                - label: 底部居中
                  value: "bottom-center"
                - label: 左下角
                  value: "bottom-left"
                - label: 左侧居中
                  value: "left-center"
                - label: 屏幕居中
                  value: "center"
              validation: required
              help: 悬浮球的初始锚点位置；开启拖拽后可自由移动。
            - $formkit: number
              name: offsetX
              id: floatingWindowOffsetX
              label: 水平偏移(px)
              value: 0
              help: 相对锚点的水平微调，可填负数。
            - $formkit: number
              name: offsetY
              id: floatingWindowOffsetY
              label: 垂直偏移(px)
              value: 0
              help: 相对锚点的垂直微调，可填负数。
            - $formkit: attachment
              name: imageUrl
              id: floatingWindowImageUrl
              label: 太阳码图片
              value: ""
              help: 选择一张小程序太阳码图片（Halo 附件）；未选择时悬浮窗不显示。
              validation: required
            - $formkit: number
              name: imageSize
              id: floatingWindowImageSize
              label: 图片尺寸(px)
              value: 100
              help: 太阳码图片的宽高，默认 100px。
              validation: required
            - $formkit: text
              name: name
              id: floatingWindowName
              label: 小程序名称
              value: "小程序"
              help: 太阳码下方显示的名称，留空则不显示名称。
            - $formkit: number
              name: nameSize
              id: floatingWindowNameSize
              label: 名称字号(px)
              value: 14
            - $formkit: color
              name: nameColor
              id: floatingWindowNameColor
              label: 名称颜色
              value: "#333333"
              format: hex8
            - $formkit: text
              name: description
              id: floatingWindowDescription
              label: 描述
              value: ""
              help: 名称下方显示的描述，留空则不显示。
            - $formkit: number
              name: descSize
              id: floatingWindowDescSize
              label: 描述字号(px)
              value: 12
            - $formkit: color
              name: descColor
              id: floatingWindowDescColor
              label: 描述颜色
              value: "#999999"
              format: hex8
            - $formkit: switch
              name: dragEnabled
              id: floatingWindowDragEnabled
              label: 允许拖拽
              value: true
            - $formkit: switch
              name: closeEnabled
              id: floatingWindowCloseEnabled
              label: 显示关闭按钮
              value: true
            - $formkit: switch
              name: edgeHideEnabled
              id: floatingWindowEdgeHideEnabled
              label: 贴边隐藏
              value: true
              help: 拖拽到屏幕边缘时自动隐藏大部分，仅露出触发条，鼠标悬停滑出。
            - $formkit: number
              name: edgeHideDistance
              id: floatingWindowEdgeHideDistance
              label: 贴边触发距离(px)
              value: 24
              help: 贴边隐藏时露出的宽度，默认 24px。
              validation: required
            - $formkit: switch
              name: rememberClosed
              id: floatingWindowRememberClosed
              label: 记住关闭状态
              value: true
              help: 开启后访客点击关闭后，同一浏览器下次访问不再显示；关闭则每次刷新都重新显示。
