apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-uni-halo-settings
spec:
  forms:
    - group: featureConfig
      label: 功能模块
      formSchema:
        - $formkit: group
          name: loveConfig
          label: 恋爱日记
          children:
            - $formkit: radio
              name: loveEnabled
              id: loveEnabled
              label: 是否启用
              value: false
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              validation: required
              help: 启用恋爱日记功能后，可以在我的页面导航找到相关入口
            - $formkit: group
              if: "$get(loveEnabled).value === true"
              name: pageImages
              label: 图片配置
              value:
                bgImageUrl: "https://uni-halo.925i.cn/uni_halo_love/love_bg1.png"
                waveImageUrl: "/plugins/uni-halo/assets/uni_halo_about_wave.gif"
                heartImageUrl: "https://uni-halo.925i.cn/uni_halo_love/like.png"
              children:
                - $formkit: attachment
                  name: bgImageUrl
                  label: 背景图片
                  value: ""
                  validation: required
                - $formkit: attachment
                  name: waveImageUrl
                  label: 波浪图片
                  value: ""
                  validation: required
                - $formkit: attachment
                  name: heartImageUrl
                  label: 爱心图片
                  value: ""
                  validation: required
            - $formkit: group
              if: "$get(loveEnabled).value === true"
              name: ourStory
              label: 恋爱故事
              value:
                enabled: true
                iconUrl: ""
                content: ""
              children:
                - $formkit: select
                  name: enabled
                  id: ourStoryEnabled
                  label: 是否启用
                  value: false
                  options:
                    - label: 是
                      value: true
                    - label: 否
                      value: false
                  validation: required
                - $formkit: attachment
                  name: iconUrl
                  label: 图标地址
                  value: ""
                  validation: required
                  help: 功能图标图片地址
            - $formkit: group
              if: "$get(loveEnabled).value === true"
              name: lovePhoto
              label: 恋爱相册
              value:
                enabled: false
                iconUrl: ""
                groupName: ""
              children:
                - $formkit: select
                  name: enabled
                  id: lovePhotoEnabled
                  label: 是否启用
                  value: false
                  options:
                    - label: 启用
                      value: true
                    - label: 关闭
                      value: false
                  validation: required
                  help: 启用恋爱相册后，可以在恋爱日记中查看恋爱相册
                - $formkit: attachment
                  name: iconUrl
                  label: 图标地址
                  value: ""
                  validation: required
                  help: 功能图标图片地址
            - $formkit: group
              if: "$get(loveEnabled).value === true"
              name: loveDaily
              label: 恋爱清单
              value:
                enabled: false
                iconUrl: ""
                list: [ ]
              children:
                - $formkit: select
                  name: enabled
                  id: loveListEnabled
                  label: 是否启用
                  value: false
                  options:
                    - label: 启用
                      value: true
                    - label: 关闭
                      value: false
                  validation: required
                - $formkit: attachment
                  name: iconUrl
                  label: 图标地址
                  value: ""
                  validation: required
                  help: 功能图标图片地址
        - $formkit: group
          name: linkConfig
          label: 友情链接
          children:
            - $formkit: radio
              name: submissionEnabled
              id: submissionEnabled
              label: 是否开放公开提交申请
              value: true
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
              help: 开启后 app 端可提交小程序链接申请，后台「链接管理-申请审核」进行审核。
            - $formkit: radio
              name: sendEmail
              id: sendEmail
              label: 审核结果邮件通知
              value: false
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
              help: 开启后，审核通过/拒绝时向申请人邮箱发送通知（复用 Halo 系统设置的邮件通知器 SMTP 配置，无需重复填写；申请未填邮箱则不发送）。
            - $formkit: text
              if: "$get(sendEmail).value === true"
              name: siteName
              label: 邮件署名
              value: "uni-halo"
              help: 审核邮件标题与正文中的站点名称。
    - group: safetyConfig
      label: 安全与风控
      formSchema:
        - $formkit: group
          name: auditConfig
          label: 审核模式
          children:
            - $formkit: radio
              name: auditModeEnabled
              id: auditModeEnabled
              label: 审核模式
              help: 开启审核模式，关闭小程序部分数据展示，小程序提交审核使建议开启，审核后关闭。
              value: false
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
        - $formkit: group
          name: captchaConfig
          label: 防刷验证码
          children:
            - $formkit: radio
              name: enabled
              id: captchaEnabled
              label: 开启验证码
              help: 总开关。关闭后所有功能都不要求验证码；开启后仅对下方「生效范围」勾选的功能要求输入验证码，防止暴力/垃圾提交。
              value: true
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
            - $formkit: group
              if: "$get(captchaEnabled).value === true"
              name: scope
              label: 生效范围
              help: 选择需要输入验证码的功能；未勾选的功能即使总开关开启也无需验证码。
              value:
                linkSubmission: true
                loveAlbumUnlock: true
              children:
                - $formkit: select
                  name: linkSubmission
                  label: 链接申请提交
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，小程序端提交链接申请时需要输入验证码，防止垃圾申请堆积。
                  validation: required
                - $formkit: select
                  name: loveAlbumUnlock
                  label: 恋爱相册解锁
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，加密恋爱相册解锁时需要输入验证码，防止暴力试密码。
                  validation: required
            - $formkit: select
              if: "$get(captchaEnabled).value === true"
              name: type
              id: captchaType
              label: 验证码类型
              value: "ALPHANUMERIC"
              options:
                - label: 图形字符
                  value: "ALPHANUMERIC"
                - label: 算术题
                  value: "ARITHMETIC"
              validation: required
            - $formkit: number
              if: "$get(captchaEnabled).value === true && $get(captchaType).value === 'ALPHANUMERIC'"
              name: captchaLength
              label: 字符长度
              value: 4
              help: 图形字符验证码的字符个数
              validation: required
            - $formkit: number
              if: "$get(captchaEnabled).value === true && $get(captchaType).value === 'ARITHMETIC'"
              name: arithmeticRange
              label: 算术范围
              value: 10
              help: 算术题运算数的取值范围（1~N）
              validation: required
    - group: integrationConfig
      label: 平台接入
      formSchema:
        - $formkit: group
          name: pluginConfig
          label: 第三方插件
          children:
            - $formkit: group
              name: votePlugin
              label: 投票管理插件
              value:
                enabled: true
                pluginId: "vote"
              children:
                - $el: div
                  attrs:
                    class: "formkit-help text-xs mt-2 text-gray-500 flex items-center mb-1 cursor-pointer"
                    innerHTML: "说明：<a href='https://www.halo.run/store/apps/app-veyvzyhv' title='前往获取投票管理插件' target='_blank' class='text-blue-500 hover:text-blue-700'>投票管理插件</a>，用于支持小程序内投票。"
                - $formkit: select
                  name: enabled
                  id: voteEnabled
                  label: 是否启用
                  value: false
                  options:
                    - label: 启用
                      value: true
                    - label: 关闭
                      value: false
                  validation: required
                - $formkit: text
                  if: "$get(voteEnabled).value === true"
                  name: pluginId
                  label: 插件ID
                  value: "vote"
                  validation: required
                - $el: div
                  if: "$get(voteEnabled).value === true"
                  attrs:
                    class: "formkit-help text-xs text-gray-500"
                    innerHTML: "插件信息的ID，<a href='/console/plugins/vote#:~:text=ID-,vote' title='前往获取插件ID' target='_blank' class='text-blue-500 hover:text-blue-700'>获取插件ID</a>。"
            - $formkit: group
              name: linksPlugin
              label: 链接管理插件
              value:
                enabled: true
                pluginId: "plugin-links"
              children:
                - $el: div
                  attrs:
                    class: "formkit-help text-xs mt-2 text-gray-500 flex items-center mb-1 cursor-pointer"
                    innerHTML: "说明：<a href='https://www.halo.run/store/apps/app-hfbQg' title='前往获取链接管理插件' target='_blank' class='text-blue-500 hover:text-blue-700'>链接管理插件</a>，用于支持小程序内友情链接。"
                - $formkit: select
                  name: enabled
                  id: linksEnabled
                  label: 是否启用
                  value: false
                  options:
                    - label: 启用
                      value: true
                    - label: 关闭
                      value: false
                  validation: required
                - $formkit: text
                  if: "$get(linksEnabled).value === true"
                  name: pluginId
                  label: 插件ID
                  value: "plugin-links"
                  validation: required
                - $el: div
                  if: "$get(linksEnabled).value === true"
                  attrs:
                    class: "formkit-help text-xs text-gray-500"
                    innerHTML: "插件信息的ID，<a href='/console/plugins/PluginLinks#:~:text=ID-,PluginLinks' title='前往获取插件ID' target='_blank' class='text-blue-500 hover:text-blue-700'>获取插件ID</a>。"
            - $formkit: group
              name: linksSubmitPlugin
              label: 友链提交插件
              value:
                enabled: false
                pluginId: "LinksSubmit"
                blogName: ""
                blogDesc: ""
                blogLogo: ""
                blogUrl: ""
              children:
                - $el: div
                  attrs:
                    class: "formkit-help text-xs mt-2 text-gray-500 flex items-center mb-1 cursor-pointer"
                    innerHTML: "说明：来自【作者：<a href='https://blog.muyin.site' title='前往作者博客' target='_blank' class='text-blue-500 hover:text-blue-700'>柳意梧情</a>】的<a href='https://auth.muyin.site/docs/LinksSubmit' title='前往获取友链自助提交插件' target='_blank' class='text-blue-500 hover:text-blue-700'>友链自助提交插件</a>，用于支持小程序内主动提交友链。"
                - $formkit: select
                  name: enabled
                  id: submitLinkEnabled
                  label: 是否启用
                  value: false
                  options:
                    - label: 启用
                      value: true
                    - label: 关闭
                      value: false
                  validation: required
                - $formkit: text
                  if: "$get(submitLinkEnabled).value === true"
                  name: pluginId
                  label: 插件ID
                  value: "LinksSubmit"
                  validation: required
                - $el: div
                  if: "$get(submitLinkEnabled).value === true"
                  attrs:
                    class: "formkit-help text-xs text-gray-500"
                    innerHTML: "插件信息的ID，<a href='/console/plugins/LinksSubmit#:~:text=ID-,LinksSubmit' title='前往获取插件ID' target='_blank' class='text-blue-500 hover:text-blue-700'>获取插件ID</a>。"
                - $formkit: text
                  if: "$get(submitLinkEnabled).value === true"
                  name: Authorization
                  label: 授权Token
                  value: ""
                  validation: required
                - $el: div
                  if: "$get(submitLinkEnabled).value === true"
                  attrs:
                    class: "formkit-help text-xs text-gray-500"
                    innerHTML: "友链自助提交插件设置的认证token，<a href='/console/plugins/LinksSubmit?tab=basicSetting#:~:text=高级设置-,认证token' title='前往获取认证token' target='_blank' class='text-blue-500 hover:text-blue-700'>获取认证token</a>。"
                - $formkit: text
                  if: "$get(submitLinkEnabled).value === true"
                  name: blogName
                  label: 博客名称
                  value: ""
                  validation: required
                - $formkit: text
                  if: "$get(submitLinkEnabled).value === true"
                  name: blogDesc
                  label: 博客描述
                  value: ""
                  validation: required
                - $formkit: attachment
                  if: "$get(submitLinkEnabled).value === true"
                  name: blogLogo
                  label: 博客Logo
                  value: ""
                  validation: required
                - $formkit: text
                  if: "$get(submitLinkEnabled).value === true"
                  name: blogUrl
                  label: 博客地址
                  value: ""
                  validation: required
            - $formkit: group
              name: toolsPlugin
              label: 工具箱插件
              value:
                enabled: false
                pluginId: "PluginTools"
                Authorization: ""
                verifyCodeType: "scan"
                scanCodeUrl: ""
                rewardedVideoAdId: ""
              children:
                - $el: div
                  attrs:
                    class: "formkit-help text-xs mt-2 text-gray-500 flex items-center mb-1 cursor-pointer"
                    innerHTML: "说明：来自【作者：<a href='https://blog.muyin.site' title='前往作者博客' target='_blank' class='text-blue-500 hover:text-blue-700'>柳意梧情</a>】的<a href='https://auth.muyin.site/docs/PluginTools' title='前往获取Tools工具箱插件' target='_blank' class='text-blue-500 hover:text-blue-700'>Tools工具箱插件</a>，用于开启支持文章加密访问。"
                - $formkit: select
                  name: enabled
                  id: toolsPluginEnabled
                  label: 是否启用
                  value: false
                  options:
                    - label: 启用
                      value: true
                    - label: 关闭
                      value: false
                  validation: required
                - $formkit: text
                  if: "$get(toolsPluginEnabled).value === true"
                  name: pluginId
                  label: 插件ID
                  value: "PluginTools"
                  validation: required
                - $el: div
                  if: "$get(toolsPluginEnabled).value === true"
                  attrs:
                    class: "formkit-help text-xs text-gray-500"
                    innerHTML: "插件信息的ID，<a href='/console/plugins/PluginTools#:~:text=ID-,PluginTools' title='前往获取插件ID' target='_blank' class='text-blue-500 hover:text-blue-700'>获取插件ID</a>。"
                - $formkit: text
                  if: "$get(toolsPluginEnabled).value === true"
                  name: Authorization
                  label: 授权Token
                  value: ""
                  validation: required
                - $el: div
                  if: "$get(toolsPluginEnabled).value === true"
                  attrs:
                    class: "formkit-help text-xs text-gray-500"
                    innerHTML: "Tools工具箱插件设置的认证token，<a href='/console/plugins/PluginTools?tab=basic#:~:text=模板设置-,认证token' title='前往获取认证token' target='_blank' class='text-blue-500 hover:text-blue-700'>获取认证token</a>。"
                - $formkit: radio
                  if: "$get(toolsPluginEnabled).value === true"
                  id: verifyCodeType
                  name: verifyCodeType
                  key: verifyCodeType
                  label: 验证码获取方式
                  value: "scan"
                  options:
                    - label: 微信公众号获取
                      value: scan
                    - label: 小程序广告获取
                      value: advert
                  help: 验证码获取方式，可以前往文章单独设置验证码获取方式。
                  validation: required
                - $formkit: attachment
                  if: "$get(verifyCodeType).value === 'scan'"
                  name: scanCodeUrl
                  key: scanCodeUrl
                  label: 扫码链接
                  value: ""
                  help: 扫码链接，请填写二维码图片的链接。
                  validation: required
                - $formkit: text
                  if: "$get(verifyCodeType).value === 'advert'"
                  name: rewardedVideoAdId
                  key: rewardedVideoAdId
                  label: 视频广告ID
                  value: ""
                  help: 广告ID，请在 微信小程序广告管理中获取。
                  validation: required
