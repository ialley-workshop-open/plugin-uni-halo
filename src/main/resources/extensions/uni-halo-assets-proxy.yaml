apiVersion: plugin.halo.run/v1alpha1
kind: ReverseProxy
metadata:
  # 建议带插件名前缀避免与其他插件冲突
  name: uni-halo-assets-proxy
rules:
  # 代理 src/main/resources/static/assets 目录下所有静态资源
  # 访问路径：/plugins/plugin-uni-halo/assets/{fileName}
  # 用途：插件内置默认图（logo/默认封面/占位图等），可在通用配置等自定义模型字段
  # 与 setting 表单中直接填写该相对路径引用（匿名可访问，不经 RBAC）
  - path: /assets/**
    file:
      directory: static/assets
